<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiKo Scoreboard</title>
  
  <!-- Firebase SDKs (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: #161e2e;
      --accent-cyan: #00f0ff;
      --accent-red: #ff334b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.14);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
    }

    body {
      background-color: transparent;
      color: var(--text-main);
      overflow: hidden;
    }

    /* ==========================================================
       MC BANNER BROADCAST OVERLAY (?mode=display)
       ========================================================== */
    #display-container {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
      pointer-events: none;
    }

    .banner-overlay-wrapper {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 880px;
      height: 285px;
    }

    .banner-frame-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    /* Left Team Pod (Away Logo) */
    .banner-logo-slot.away {
      position: absolute;
      left: 8.5%;
      top: 25.5%;
      width: 24.5%;
      height: 47%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    /* Right Team Pod (Home Logo) */
    .banner-logo-slot.home {
      position: absolute;
      left: 67.0%;
      top: 25.5%;
      width: 24.5%;
      height: 47%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .banner-logo-slot img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Left Digit Box (Away Score) */
    .banner-score.away {
      position: absolute;
      left: 39.3%;
      top: 36.5%;
      width: 8.4%;
      height: 27.5%;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: 50px;
      line-height: 1;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.95), 2px 2px 4px #000000;
      user-select: none;
    }

    /* Right Digit Box (Home Score) */
    .banner-score.home {
      position: absolute;
      left: 52.3%;
      top: 36.5%;
      width: 8.4%;
      height: 27.5%;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: 50px;
      line-height: 1;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 51, 75, 0.95), 2px 2px 4px #000000;
      user-select: none;
    }

    /* ==========================================================
       CONTROLLER INTERFACE (Default view)
       ========================================================== */
    #controller-container {
      background-color: var(--bg-dark);
      min-height: 100vh;
      padding: 20px;
      max-width: 760px;
      margin: 0 auto;
      overflow-y: auto;
    }

    .controller-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .controller-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .live-status {
      font-size: 12px;
      font-weight: 700;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .game-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .game-btn:active {
      transform: scale(0.98);
    }

    .game-btn.active {
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.12);
    }

    .game-btn-time {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .game-btn-match {
      font-size: 13px;
      font-weight: 700;
    }

    .scoreboard-box {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .score-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .team-controller {
      text-align: center;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 16px 12px;
    }

    .ctrl-team-name {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #e2e8f0;
      min-height: 20px;
    }

    .ctrl-score-value {
      font-size: 52px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 12px;
    }

    /* Score Action Cluster */
    .score-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .score-btn {
      padding: 11px 0;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      transition: opacity 0.15s ease, transform 0.05s ease;
      user-select: none;
    }

    .score-btn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    /* Primary Touchdown Button */
    .btn-td {
      background-color: #16a34a; /* Field Green */
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    /* Sub-row for XP & Safety */
    .btn-sub-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .btn-xp {
      background-color: #2563eb; /* Cobalt Blue */
      font-size: 12px;
      padding: 9px 0;
    }

    .btn-saf {
      background-color: #7c3aed; /* Purple */
      font-size: 12px;
      padding: 9px 0;
    }

    /* Manual Adjustment Row */
    .btn-adjust-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-plus-small {
      background-color: #334155;
      font-size: 13px;
      padding: 8px 0;
    }

    .btn-minus {
      background-color: #475569;
      font-size: 13px;
      padding: 8px 0;
    }

    .reset-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background-color: #dc2626;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .shortcuts-note {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- ================= DISPLAY OVERLAY ================= -->
  <div id="display-container">
    <div class="banner-overlay-wrapper">
      <img class="banner-frame-bg" src="frame.png" alt="Scoreboard Frame">

      <!-- Left Team Logo -->
      <div class="banner-logo-slot away">
        <img id="disp-away-logo" src="ttp.png" alt="Away Logo" data-team="TTP" onerror="handleImageError(this)">
      </div>

      <!-- Away Score -->
      <div class="banner-score away" id="disp-away-score">0</div>

      <!-- Home Score -->
      <div class="banner-score home" id="disp-home-score">0</div>

      <!-- Right Team Logo -->
      <div class="banner-logo-slot home">
        <img id="disp-home-logo" src="alphas.png" alt="Home Logo" data-team="ALPHAS" onerror="handleImageError(this)">
      </div>
    </div>
  </div>

  <!-- ================= CONTROLLER INTERFACE ================= -->
  <div id="controller-container">
    <div class="controller-header">
      <div class="controller-title">FiKo Scoreboard Controller</div>
      <div class="live-status" id="connection-status">
        <div class="status-dot"></div>
        <span>CONNECTING...</span>
      </div>
    </div>

    <div class="section-label">Select Game (Week 5 • Field MEL)</div>
    <div class="game-grid" id="game-buttons"></div>

    <div class="scoreboard-box">
      <div class="score-columns">
        <!-- Away Team Controller -->
        <div class="team-controller">
          <div class="ctrl-team-name" id="ctrl-away-name">TTP</div>
          <div class="ctrl-score-value" id="ctrl-away-score">0</div>
          
          <div class="score-controls">
            <button class="score-btn btn-td" onclick="changeScore('away', 6)">+6 TD</button>
            <div class="btn-sub-row">
              <button class="score-btn btn-xp" onclick="changeScore('away', 1)">+1 XP</button>
              <button class="score-btn btn-xp" onclick="changeScore('away', 2)">+2 XP</button>
              <button class="score-btn btn-saf" onclick="changeScore('away', 2)">+2 SAF</button>
            </div>
            <div class="btn-adjust-row">
              <button class="score-btn btn-minus" onclick="changeScore('away', -1)">-1</button>
              <button class="score-btn btn-plus-small" onclick="changeScore('away', 1)">+1</button>
            </div>
          </div>
        </div>

        <!-- Home Team Controller -->
        <div class="team-controller">
          <div class="ctrl-team-name" id="ctrl-home-name">ALPHAS</div>
          <div class="ctrl-score-value" id="ctrl-home-score">0</div>
          
          <div class="score-controls">
            <button class="score-btn btn-td" onclick="changeScore('home', 6)">+6 TD</button>
            <div class="btn-sub-row">
              <button class="score-btn btn-xp" onclick="changeScore('home', 1)">+1 XP</button>
              <button class="score-btn btn-xp" onclick="changeScore('home', 2)">+2 XP</button>
              <button class="score-btn btn-saf" onclick="changeScore('home', 2)">+2 SAF</button>
            </div>
            <div class="btn-adjust-row">
              <button class="score-btn btn-minus" onclick="changeScore('home', -1)">-1</button>
              <button class="score-btn btn-plus-small" onclick="changeScore('home', 1)">+1</button>
            </div>
          </div>
        </div>
      </div>

      <button class="reset-btn" onclick="resetScores()">RESET SCORE (0 - 0)</button>
      <div class="shortcuts-note">
        Keyboard Shortcuts: <b>+ / =</b> (Home +1) | <b>-</b> (Home -1) | <b>]</b> (Away +1) | <b>[</b> (Away -1)
      </div>
    </div>
  </div>

  <script>
    function createCrestBadge(text, bgHex = "#161e2e", textHex = "#ffffff") {
      const label = (text || "TEAM").trim();
      const fontSize = label.length > 7 ? 15 : label.length > 4 ? 18 : 26;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="${bgHex}" stroke="#ffffff" stroke-width="4"/>
        <text x="50" y="58" font-size="${fontSize}" font-family="Arial Black, Impact, sans-serif" font-weight="900" fill="${textHex}" text-anchor="middle">${label}</text>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function handleImageError(img) {
      const teamName = img.dataset.team || img.alt || "TEAM";
      if (img.src.endsWith(".png")) {
        img.src = img.src.replace(".png", ".jpg");
      } else if (!img.src.startsWith("data:image")) {
        img.src = createCrestBadge(teamName);
      }
    }

    /* ==========================================================
       WEEK 5 FIELD MEL MATCHUPS
       ========================================================== */
    const MEL_WEEK5_GAMES = [
      {
        id: 1,
        time: "8:00 AM",
        awayName: "TTP",
        homeName: "ALPHAS",
        awayLogo: "ttp.png",
        homeLogo: "alphas.png"
      },
      {
        id: 2,
        time: "9:00 AM",
        awayName: "4TF",
        homeName: "NEW WAVE",
        awayLogo: "4tf.png",
        homeLogo: "nw.png"
      },
      {
        id: 3,
        time: "10:00 AM",
        awayName: "VGZ",
        homeName: "REAPERS",
        awayLogo: "vgz.png",
        homeLogo: "reapers.png"
      },
      {
        id: 4,
        time: "11:00 AM",
        awayName: "GRIZZLIES",
        homeName: "GREMLINS",
        awayLogo: "grizzlies.png",
        homeLogo: "gremlins.png"
      },
      {
        id: 5,
        time: "12:00 PM",
        awayName: "RED",
        homeName: "PITBULLS",
        awayLogo: "red.png",
        homeLogo: "pb.png"
      },
      {
        id: 6,
        time: "1:00 PM",
        awayName: "BB",
        homeName: "NIGHTMARE",
        awayLogo: "bb.png",
        homeLogo: "nm.png"
      }
    ];

    /* ==========================================================
       FIREBASE CONFIG
       ========================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyDZKiu4pb9qh_pwG3z8NJdB6siQ6pyPtc4",
      authDomain: "fiko-scoreboard.firebaseapp.com",
      databaseURL: "https://fiko-scoreboard-default-rtdb.firebaseio.com",
      projectId: "fiko-scoreboard",
      storageBucket: "fiko-scoreboard.firebasestorage.app",
      messagingSenderId: "829447749880",
      appId: "1:829447749880:web:c7532983c2543911fbfb0d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const isDisplay = urlParams.get('mode') === 'display';

    let currentHomeScore = 0;
    let currentAwayScore = 0;
    let activeGameId = 1;

    if (isDisplay) {
      document.getElementById('display-container').style.display = 'block';
      document.getElementById('controller-container').style.display = 'none';
      document.body.style.backgroundColor = 'transparent';
    } else {
      document.getElementById('display-container').style.display = 'none';
      document.getElementById('controller-container').style.display = 'block';
      renderGameButtons();
    }

    auth.signInAnonymously()
      .then(() => {
        const statusElem = document.getElementById('connection-status');
        if (statusElem) {
          statusElem.innerHTML = '<div class="status-dot"></div><span>LIVE • CONNECTED</span>';
          statusElem.style.color = '#22c55e';
        }
        listenToDatabase();
      })
      .catch((err) => {
        console.error("Auth error:", err);
      });

    function listenToDatabase() {
      db.ref("/").on("value", (snapshot) => {
        const val = snapshot.val();
        if (!val) return;

        currentHomeScore = val.homeScore ?? 0;
        currentAwayScore = val.awayScore ?? 0;

        if (isDisplay) {
          document.getElementById('disp-away-score').textContent = currentAwayScore;
          document.getElementById('disp-home-score').textContent = currentHomeScore;
          
          if (val.awayLogo) {
            const el = document.getElementById('disp-away-logo');
            el.dataset.team = val.awayTeam || "AWAY";
            el.src = val.awayLogo;
          }
          if (val.homeLogo) {
            const el = document.getElementById('disp-home-logo');
            el.dataset.team = val.homeTeam || "HOME";
            el.src = val.homeLogo;
          }
        } else {
          document.getElementById('ctrl-away-name').textContent = val.awayTeam || "AWAY";
          document.getElementById('ctrl-home-name').textContent = val.homeTeam || "HOME";
          document.getElementById('ctrl-away-score').textContent = currentAwayScore;
          document.getElementById('ctrl-home-score').textContent = currentHomeScore;
        }
      });
    }

    function renderGameButtons() {
      const container = document.getElementById('game-buttons');
      container.innerHTML = "";
      MEL_WEEK5_GAMES.forEach((g) => {
        const btn = document.createElement('button');
        btn.className = `game-btn ${g.id === activeGameId ? 'active' : ''}`;
        btn.id = `btn-game-${g.id}`;
        btn.onclick = () => selectGame(g.id);
        btn.innerHTML = `
          <div class="game-btn-time">Game ${g.id} • ${g.time}</div>
          <div class="game-btn-match">${g.awayName} vs ${g.homeName}</div>
        `;
        container.appendChild(btn);
      });
    }

    function selectGame(id) {
      activeGameId = id;
      document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-game-${id}`);
      if (activeBtn) activeBtn.classList.add('active');

      const match = MEL_WEEK5_GAMES.find(g => g.id === id);
      if (!match) return;

      db.ref("/").update({
        awayTeam: match.awayName,
        homeTeam: match.homeName,
        awayLogo: match.awayLogo,
        homeLogo: match.homeLogo,
        awayScore: 0,
        homeScore: 0
      });
    }

    function changeScore(team, delta) {
      if (team === 'home') {
        const newScore = Math.max(0, currentHomeScore + delta);
        db.ref("/").update({ homeScore: newScore });
      } else {
        const newScore = Math.max(0, currentAwayScore + delta);
        db.ref("/").update({ awayScore: newScore });
      }
    }

    function resetScores() {
      if (confirm("Reset scores to 0 - 0?")) {
        db.ref("/").update({ homeScore: 0, awayScore: 0 });
      }
    }

    window.addEventListener('keydown', (e) => {
      if (isDisplay) return;
      if (e.key === '=' || e.key === '+') changeScore('home', 1);
      if (e.key === '-' || e.key === '_') changeScore('home', -1);
      if (e.key === ']') changeScore('away', 1);
      if (e.key === '[') changeScore('away', -1);
    });
  </script>
</body>
</html>
